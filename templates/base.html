<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LibraryTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'catalog:home' %}">LibraryTrack</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'dashboard:member' %}">Member Dashboard</a>
        <a class="nav-link" href="{% url 'dashboard:admin' %}">Admin Dashboard</a>
        <a class="nav-link" href="{% url 'requests:contact' %}">Contact</a>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-link nav-link">Logout</button></form>
        {% else %}
          <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
          <a class="nav-link" href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
