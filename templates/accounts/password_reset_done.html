{% extends "base.html" %}
{% block title %}Check your email · LibraryTrack{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card card-lg text-center">
    <div class="stat-icon" style="margin:0 auto 1rem; width:54px; height:54px; border-radius:16px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    </div>
    <h1 style="font-size:1.5rem;">Check your inbox</h1>
    <p class="muted mb-2">If an account matches that email, a reset link is on its way.</p>
    <a class="btn btn-soft" href="{% url 'accounts:login' %}">Back to log in</a>
  </div>
</div>
{% endblock %}
