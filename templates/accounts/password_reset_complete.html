{% extends "base.html" %}
{% block title %}Password updated · LibraryTrack{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card card-lg text-center">
    <div class="stat-icon" style="margin:0 auto 1rem; width:54px; height:54px; border-radius:16px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1 style="font-size:1.5rem;">Password updated</h1>
    <p class="muted mb-2">You can now log in with your new password.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
  </div>
</div>
{% endblock %}
